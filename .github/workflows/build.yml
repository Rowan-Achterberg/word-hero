name: Build Windows installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Logic tests (dictionary, OCR merge rules)
        run: npm test
      - name: Build ARM64 installer
        run: npx electron-builder --win nsis --arm64 --publish never
      - name: Build x64 installer
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: WordHero-installers
          path: dist/WordHero-Setup-*.exe
          if-no-files-found: error
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Every push to main (re)publishes the release for the version in package.json.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: 单词小英雄 WordHero v${{ steps.ver.outputs.v }}
          files: dist/WordHero-Setup-*.exe
          body: |
            ## 下载安装
            - **Windows 11 ARM64**（骁龙等 ARM 电脑）：下载 `WordHero-Setup-${{ steps.ver.outputs.v }}-arm64.exe`
            - Intel / AMD 电脑：下载 `WordHero-Setup-${{ steps.ver.outputs.v }}-x64.exe`

            双击安装即可。安装包没有代码签名，首次运行如果出现 Windows SmartScreen 提示，请点「更多信息 → 仍要运行」。
